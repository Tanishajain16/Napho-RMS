services:
  # SQLite "database container": owns the napho.db file in a named volume
  # and serves a web UI for browsing / querying it at http://localhost:8080
  db:
    image: coleifer/sqlite-web
    container_name: napho_sqlite
    environment:
      SQLITE_DATABASE: napho.db
    ports:
      - "8080:8080"
    volumes:
      - napho_sqlite:/data
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: napho_backend
    env_file:
      - path: ./backend/.env
        required: false   # optional: holds ANTHROPIC_API_KEY for the AI chat feature
    environment:
      DATABASE_URL: sqlite:////data/napho.db
      UPLOAD_DIR: /app/uploads
      SEED_SAMPLE_DATA: "false"   # keep users/config seeded, but never re-insert demo claims
    ports:
      - "8000:8000"
    volumes:
      - napho_sqlite:/data
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  napho_sqlite:
